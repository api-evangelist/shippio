name: Shippio
description: >-
  Shippio is a Japanese logistics-technology company positioning itself as "Japan's first
  digital forwarder." It provides cloud-based SaaS for visualizing and streamlining
  international trade and freight-forwarding operations, combining domain expertise with
  AI-era digital technology. Its product line includes Shippio Forwarding (a digital
  forwarding service), Shippio Cargo (trade-management SaaS for shippers/importers-exporters),
  and Shippio Works (trade-management SaaS for logistics operators), delivered through a
  multi-sided platform that connects shippers and operators. The company is backed by
  500 Global. As of this enrichment pass Shippio publishes no public developer portal, API
  documentation, SDKs, or pricing; its APIs are internal platform APIs referenced only in
  engineering job postings, so this profile is identity-only with no public API surface.
